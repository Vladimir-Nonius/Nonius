<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonius — просмотр</title>
<style>
  :root {
    --panel: rgba(255, 255, 255, 0.92);
    --text: #1f2933;
    --muted: #5f6b7a;
    --line: #d5dae1;
    --accent: #2f6fd6;
    --unchanged: #b0b6be;
    --added: #22aa4c;
    --removed: #d63031;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(#f4f6f9, #d9dee5);
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .card {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(30, 40, 55, 0.08);
  }
  #title { top: 12px; left: 12px; padding: 10px 14px; max-width: calc(100% - 24px); }
  #title h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #title p { margin: 2px 0 0; color: var(--muted); }
  #panel { top: 12px; right: 12px; width: 270px; padding: 12px 14px; }
  #panel h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .layer { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  .layer input { margin: 0; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0, 0, 0, 0.15); }
  .layer .name { flex: 1; white-space: nowrap; }
  .layer .value { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .option { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); cursor: pointer; }
  .note { margin: 6px 0 0; color: var(--muted); }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  button {
    font: inherit; padding: 5px 8px; border-radius: 6px; cursor: pointer;
    background: #fff; color: var(--text); border: 1px solid var(--line);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #hint { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; color: var(--muted); white-space: nowrap; }
  #message {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; font-size: 16px; color: var(--muted); pointer-events: none;
  }
  #message.error { color: #a12a2a; }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; }
    #hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/three/three.module.min.js",
    "three/addons/": "/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="title" class="card"><h1>Nonius</h1><p>Загрузка…</p></div>
<div id="panel" class="card" hidden>
  <h2>Слои</h2>
  <div id="layers"></div>
  <label class="option" id="xray-row"><input type="checkbox" id="xray" checked> Серое прозрачным (рентген)</label>
  <p class="note" id="no-changes" hidden>Изменений формы нет.</p>
  <div class="views">
    <button data-view="iso">Изометрия</button>
    <button data-view="front">Спереди</button>
    <button data-view="top">Сверху</button>
    <button data-view="right">Справа</button>
  </div>
</div>
<div id="hint" class="card">Левая кнопка — вращать · правая — сдвигать · колесо — приближать · двойной щелчок — показать целиком</div>
<div id="message">Загрузка модели…</div>
<script type="module" src="/viewer.js"></script>
</body>
</html>
