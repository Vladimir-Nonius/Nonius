[package]
name = "nonius-occt"
description = "OpenCascade geometry for Nonius: STEP properties, boolean diff, colored change highlight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
nonius-core.workspace = true
nonius-step.workspace = true
png = "0.17"
nonius-scene.workspace = true
sha2.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile.workspace = true

# Единственный крейт, где разрешён unsafe: вызовы C-прослойки OpenCascade.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
