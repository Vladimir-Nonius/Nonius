[package]
name = "nonius-cli"
description = "Command-line interface for Nonius CAD version control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nonius"
path = "src/main.rs"

[dependencies]
nonius-core.workspace = true
nonius-app.workspace = true
nonius-step.workspace = true
nonius-occt.workspace = true
nonius-solidworks.workspace = true
nonius-sldprt.workspace = true
nonius-scene.workspace = true
nonius-gui.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
trash = "5"

[dev-dependencies]
tempfile.workspace = true
egui_kittest = { version = "0.32", features = ["eframe"] }
eframe = { version = "0.32", default-features = false, features = ["accesskit"] }

[lints]
workspace = true
