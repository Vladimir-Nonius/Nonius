name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  OCCT_PACKAGES: >-
    libocct-foundation-dev libocct-modeling-data-dev
    libocct-modeling-algorithms-dev libocct-data-exchange-dev

jobs:
  fmt:
    name: Форматирование
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: OpenCascade
        run: sudo apt-get update -q && sudo apt-get install -y -q $OCCT_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format=short 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          # замечания clippy — аннотациями прямо на строках pull request
          grep -E '^[^ ]+\.rs:[0-9]+:[0-9]+: (warning|error)' clippy.log \
            | sed -E 's/^([^:]+):([0-9]+):[0-9]+: (warning|error): (.*)$/::error file=\1,line=\2::\4/'
          if [ "$status" -ne 0 ]; then
            grep -E '^(error|warning)' clippy.log | head -20 | sed -E 's/^/::error::/'
          fi
          exit $status

  test:
    name: Тесты (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  geometry:
    name: Геометрия (OpenCascade)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: OpenCascade
        run: sudo apt-get update -q && sudo apt-get install -y -q $OCCT_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(error|warning)|panicked|FAILED|^---- " test.log | head -40 | sed -E 's/^/::error::/'
          fi
          exit $status
      - name: Проверка, что геометрия включилась
        run: cargo run -q -p nonius-cli -- modules | tee modules.txt && grep -q "OpenCascade" modules.txt

  msrv:
    name: Минимальная версия Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
