[workspace]
resolver = "3"
members = [
    "crates/nonius-core",
    "crates/nonius-store",
    "crates/nonius-step",
    "crates/nonius-scene",
    "crates/nonius-occt",
    "crates/nonius-app",
    "crates/nonius-gui",
    "crates/nonius-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Vladimir-Nonius/Nonius"
authors = ["Nonius contributors"]

[workspace.dependencies]
nonius-core = { path = "crates/nonius-core" }
nonius-store = { path = "crates/nonius-store" }
nonius-step = { path = "crates/nonius-step" }
nonius-scene = { path = "crates/nonius-scene" }
nonius-occt = { path = "crates/nonius-occt" }
nonius-app = { path = "crates/nonius-app" }
nonius-gui = { path = "crates/nonius-gui" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
